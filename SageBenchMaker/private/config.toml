# Boolean columns
columns_boolean = [
    "horizon_present",      # True if horizon line is visible
    "ground_present",       # True if ground or terrain is visible
    "sky_dominates",        # Sky dominates the frame
    "vegetation_present",   # True if trees, grass, plants are visible
    "water_present",        # True if body of water, puddles, or stream is visible
    "buildings_present",    # Man-made structures or buildings visible
    "vehicle_present",      # True if a vehicle appears in the image
    "person_present",       # True if a person appears in the image
    "animal_present",       # True if an animal appears in the image
    "night_scene",           # Image is clearly night or very low light
    "precipitation_visible", # Rain, snow, or other precipitation visible
    "multiple_objects",     # True if more than one distinct object category is present
]

# Taxonomy columns
[columns_taxonomy]
viewpoint = [
    "ground_upward",     # Camera tilted up, sky-focused
    "ground_horizontal", # Camera level, horizon in frame
    "oblique",           # Angled, neither level nor straight up
    "fisheye_sky",       # Wide/fisheye sky dome (e.g. top camera)
    "street_view",      # Facing along or across a street/sidewalk
    "overhead",         # From above, e.g., drone, surveillance camera
    "distant",          # Object small/far in frame
    "duo_view",          # Two views of the same scene
    "other",
    "unknown"
]
lighting = [
    "day",            # Full daylight
    "night",          # Dark, low light, or artificial light
    "dusk",           # Twilight, sunrise, sunset
    "overcast_light", # Daylight but overcast
    "other",
    "unknown"
]
environment_type = [
    "sky_dominant",   # Mostly sky in frame
    "ground_dominant", # Mostly ground/terrain
    "mixed",          # Balanced sky and ground
    "urban",          # Buildings, streets, built environment dominant
    "rural",          # Rural area dominant
    "vegetation",     # Trees, grass, natural green dominant
    "water",          # Body of water dominant
    "other",
    "unknown"
]
sky_condition = [
    "clear",          # Clear sky
    "partly_cloudy",  # Some clouds
    "overcast",       # Cloudy, no clear sky
    "fog_or_haze",    # Reduced visibility, fog or haze
    "precipitation",  # Rain, snow, or other precipitation visible
    "other",
    "unknown"
]

# Vision adapter configuration (OpenAI)
[vision_config]
adapter = "openai"
model = "gpt-5-mini"
system_prompt = """You are a scientist labeling sensor network images for a wide range of domains for an image-retrieval benchmark focused on queries that reference sensor metadata.
Output MUST be valid JSON matching the schema. Do not include extra keys.
Use the allowed taxonomy values exactly. Be conservative: if unsure, choose 'unknown'.
Tagging rules: Prefer tags that help retrieval; avoid redundant near-duplicates.

Sensor network guidance:
- The sensor network is a national network (100+ nodes, 17 states) with RGB/IR cameras, LiDAR, and environmental sensors. 
- Nodes run ML at the edge and send results to central servers. 
- Use cases: wildfire, agriculture, urban science, ecosystem monitoring, and more.
- Benchmark images are from these fixed outdoor nodes; metadata (vsn, zone, job, etc.) identifies the source.
- The nodes are a cluster of computers that are connected to each other via kubernetes.

Sensor metadata definition:
- vsn: The node unique identifier.
- zone: The compute zone used by the image. (for example enclosure, core, shield)
- host: The host name of the computer that took the image.
- job: The job name that scheduled the image capture.
- plugin: The software plugin name that took the image.
- camera: The camera name that took the image.
- project: The project name that the node belongs to.
- address: The address of the node.
"""

user_prompt = """Analyze this sensor network image and output JSON with the following fields.

Sensor metadata: This image is from a sensor network node called {metadata.vsn}, in the zone {metadata.zone}, hosted by {metadata.host}, with job {metadata.job}, plugin {metadata.plugin}, camera {metadata.camera}, project {metadata.project}, and address {metadata.address}. Use this as context.

Required fields:
1. summary: <= 30 words, factual description of the scene. No speculation.

2. Taxonomy fields (use exact values from allowed lists):
   - viewpoint: Camera perspective (ground_upward, ground_horizontal, oblique, fisheye_sky, street_view, overhead, distant, duo_view, other, unknown)
   - lighting: Lighting conditions (day, night, dusk, overcast_light, other, unknown)
   - environment_type: What dominates the scene (sky_dominant, ground_dominant, mixed, urban, rural, vegetation, water, other, unknown)
   - sky_condition: Weather/atmosphere (clear, partly_cloudy, overcast, fog_or_haze, precipitation, other, unknown)

3. Boolean fields (true/false):
   - horizon_present: Horizon line is visible
   - ground_present: Ground or terrain visible
   - sky_dominates: Sky dominates the frame
   - vegetation_present: Trees, grass, or plants visible
   - water_present: Body of water, puddles, or stream visible
   - buildings_present: Man-made structures or buildings visible
   - vehicle_present: Cars, trucks, or other vehicles visible
   - person_present: One or more people visible in frame
   - animal_present: An animal appears in the image
   - night_scene: Image is clearly night or very low light
   - precipitation_present: Rain, snow, or other precipitation visible
   - multiple_objects: More than one distinct object category is present

4. tags: Choose 12-18 tags ONLY from the provided enum list. Focus on scene content and conditions.

5. confidence: 0.0-1.0 confidence score for each taxonomy field (viewpoint, lighting, environment_type, sky_condition). Higher values indicate higher certainty.
"""
max_output_tokens = 8000
reasoning_effort = "low"
image_detail = "low"
max_images_per_batch = 900
completion_window = "24h"
vision_metadata_columns = ["vsn", "zone", "host", "job", "plugin", "camera", "project", "address"]

price_per_million_input_tokens = 0.125
price_per_million_output_tokens = 1.00
price_per_million_cached_input_tokens = 0.0125
price_per_million_image_input_tokens = 0.125
price_per_million_image_output_tokens = 1.00

min_tags = 12
max_tags = 18
