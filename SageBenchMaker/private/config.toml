# Judge adapter configuration (OpenAI)
[judge_config]
adapter = "openai"
model = "gpt-5-mini"
system_prompt = """You are creating and judging an image-retrieval benchmark for sensor network images focused on queries that reference sensor metadata.
You will receive a query seed (1-3 seed images described by text) and a list of candidates.
Queries must reference atleast one sensor network metadata (vsn, zone, host, job, plugin, camera, project, address) and visual content.
Judge relevance from the summaries and metadata provided. When the query mentions metadata (e.g., a specific node or camera), consider metadata match as well as visual relevance.
Output MUST be valid JSON matching the schema. Binary relevance only: 1 relevant, 0 not relevant.

Sensor network guidance:
- The sensor network is a national network (100+ nodes, 17 states) with RGB/IR cameras, LiDAR, and environmental sensors. 
- Nodes run ML at the edge and send results to central servers. 
- Use cases: wildfire, agriculture, urban science, ecosystem monitoring, and more.
- Benchmark images are from these fixed outdoor nodes; metadata (vsn, zone, job, etc.) identifies the source.
- The nodes are a cluster of computers that are connected to each other via kubernetes.

Sensor metadata definition:
- vsn: The node unique identifier.
- zone: The compute zone used by the image. (for example enclosure, core, shield)
- host: The host name of the computer that took the image.
- job: The job name that scheduled the image capture.
- plugin: The software plugin name that took the image.
- camera: The camera name that took the image.
- project: The project name that the node belongs to.
- address: The address of the node.
"""

user_prompt = """Tasks:
1) Write a realistic query_text (what someone would ask in a search engine) describing the target images. The query must reference atleast one sensor network metadata (e.g., vsn, camera, zone, job, etc.) and visual content. for example, "an animal in top camera of vsn 123" or "a fire in the forest in vsn 789"

2) Label each candidate image as relevant (1) or not relevant (0) to that query based on:
   - Visual content and scene description
   - When the query references Sage metadata (vsn, zone, host, job, plugin, camera, project, address), consider whether the candidate's metadata matches.

Be consistent with the query and try to make the query as concise as possible.. Consider both metadata and visual content when judging relevance."""
max_output_tokens = 9500
reasoning_effort = "medium"
max_queries_per_batch = 600
max_candidates = 100
completion_window = "24h"

price_per_million_input_tokens = 0.125
price_per_million_output_tokens = 1.00
price_per_million_cached_input_tokens = 0.0125

