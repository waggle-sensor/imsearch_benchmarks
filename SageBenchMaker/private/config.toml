# SageBenchMaker Configuration (Private)
# Private benchmark: may include urban Sage nodes. Use public/config.toml for non-urban (public) dataset.

log_level = "INFO"

benchmark_name = "SageBench-private"
benchmark_description = "A benchmark for Sage image retrieval when queries reference Sage metadata (vsn, zone, host, job, plugin, camera, project, address)"
benchmark_author = "Francisco Lozano"
benchmark_author_email = "francisco.lozano@northwestern.edu"
benchmark_author_affiliation = "Northwestern University"
benchmark_author_orcid = "0009-0003-8823-4046"
benchmark_author_github = "FranciscoLozCoding"

# Column names (matching framework structure)
column_image = "image"
column_image_id = "image_id"
column_mime_type = "mime_type"
column_license = "license"
column_doi = "doi"
column_query = "query_text"
column_query_id = "query_id"
column_relevance = "relevance_label"
column_tags = "tags"
column_summary = "summary"
column_confidence = "confidence"

# Image URL configuration
image_base_url = "https://web.lcrc.anl.gov/public/waggle/datasets/SageBench/images"
image_url_temp_column = "image_url"

# File paths
image_root_dir = "/tmp/SageBench/images"
meta_json = "/tmp/SageBench/images/rights_map.json"
metadata_jsonl = "/tmp/SageBench/images/metadata.jsonl"
images_jsonl = "/Volumes/data/inputs/images.jsonl"
seeds_jsonl = "/Volumes/data/inputs/seeds.jsonl"
annotations_jsonl = "/Volumes/data/outputs/annotations.jsonl"
query_plan_jsonl = "/Volumes/data/outputs/query_plan.jsonl"
qrels_jsonl = "/Volumes/data/outputs/sagebench_qrels.jsonl"
qrels_with_score_jsonl = "/Volumes/data/outputs/sagebench_qrels_with_similarity_score.jsonl"
summary_output_dir = "/Volumes/data/outputs/summary"
hf_dataset_dir = "/Volumes/data/outputs/hf_dataset"
hf_dataset_card_path = "/Users/franciscolozano/Documents/Github/imsearch_benchmarks/SageBenchMaker/private/dataset_card.md"

# Query planning
#TODO: update to conform to Sagebench
query_plan_num_seeds = 120
query_plan_neg_total = 40
query_plan_neg_hard = 25
query_plan_neg_nearmiss = 10
query_plan_neg_easy = 5
query_plan_random_seed = 14
query_plan_seed_image_ids_column = "seed_image_ids"
query_plan_candidate_image_ids_column = "candidate_image_ids"

# Hugging Face configuration (sensitive fields use _ prefix)
_hf_repo_id = "sagecontinuum/SageBench-private"
_hf_private = true

# Boolean columns
#TODO: update to conform to Sagebench
columns_boolean = [
    "horizon_visible",
    "ground_visible",
    "sky_dominates",
]

# Taxonomy columns
#TODO: update to conform to Sagebench
[columns_taxonomy]
viewpoint = [
    "ground_upward",
    "ground_horizontal",
    "oblique",
    "other",
    "unknown"
]
lighting = [
    "day",
    "night",
    "dusk",
    "other",
    "unknown"
]

# Vision adapter configuration (OpenAI)
#TODO: update to conform to Sagebench
[vision_config]
adapter = "openai"
model = "gpt-5-mini"
system_prompt = """You are labeling Sage sensor images for an image-retrieval benchmark.
Output MUST be valid JSON matching the schema. Do not include extra keys.
Use the allowed taxonomy values exactly. Be conservative: if unsure, choose 'unknown'.
Tagging rules: Prefer tags that help retrieval; avoid redundant near-duplicates."""

user_prompt = """Analyze this Sage sensor image and output JSON with the following fields.

Metadata context: This image is from Sage node {metadata.vsn}, zone {metadata.zone}, host {metadata.host}, job {metadata.job}, plugin {metadata.plugin}, camera {metadata.camera}, project {metadata.project}, address {metadata.address}. Use this as context.

Required fields:
1. summary: <= 30 words, factual description of the scene. No speculation.

2. Taxonomy fields (use exact values from allowed lists):
   - viewpoint: Camera perspective
   - lighting: Lighting conditions

3. Boolean fields (true/false):
   - horizon_visible: Horizon line is visible
   - ground_visible: Ground or terrain visible
   - sky_dominates: Sky dominates the frame

4. tags: Choose 12-18 tags ONLY from the provided enum list. Focus on scene content and conditions.

5. confidence: 0.0-1.0 confidence score for each taxonomy field (viewpoint, lighting).
"""
max_output_tokens = 4000
reasoning_effort = "low"
image_detail = "low"
max_images_per_batch = 900
completion_window = "24h"
vision_metadata_columns = ["vsn", "zone", "host", "job", "plugin", "camera", "project", "address"]

price_per_million_input_tokens = 0.125
price_per_million_output_tokens = 1.00
price_per_million_cached_input_tokens = 0.0125
price_per_million_image_input_tokens = 0.125
price_per_million_image_output_tokens = 1.00

min_tags = 12
max_tags = 18
controlled_tag_vocab = [
    "sky", "clouds", "clear_sky", "partly_cloudy", "overcast",
    "horizon_visible", "ground_visible", "terrain_visible",
    "daytime", "nighttime", "dusk", "sunrise", "sunset",
    "outdoor", "landscape", "vegetation", "urban", "rural",
    "sensor_view", "fixed_camera", "wide_angle",
]

# Judge adapter configuration (OpenAI)
#TODO: update to conform to Sagebench
[judge_config]
adapter = "openai"
model = "gpt-5-mini"
system_prompt = """You are creating and judging an image-retrieval benchmark for Sage sensor images.
You will receive a query seed (1-3 seed images described by text) and a list of candidates.
Queries may reference Sage metadata (vsn, zone, host, job, plugin, camera, project, address) or visual content.
Judge relevance from the summaries and metadata provided. When the query mentions metadata (e.g., a specific node or camera), consider metadata match as well as visual relevance.
Output MUST be valid JSON matching the schema. Binary relevance only: 1 relevant, 0 not relevant."""

user_prompt = """Tasks:
1) Write a realistic query_text (what someone would ask in a search engine) describing the target images. The query may reference Sage metadata (e.g., node VSN, camera, zone, job) and/or visual content (sky, clouds, scene type).

2) Label each candidate image as relevant (1) or not relevant (0) to that query based on:
   - Visual content and scene description
   - When the query references Sage metadata (vsn, zone, host, job, plugin, camera, project, address), consider whether the candidate's metadata matches.

Be consistent and concise. Consider both metadata and visual content when judging relevance."""
max_output_tokens = 8000
reasoning_effort = "medium"
max_queries_per_batch = 600
max_candidates = 100
completion_window = "24h"

price_per_million_input_tokens = 0.125
price_per_million_output_tokens = 1.00
price_per_million_cached_input_tokens = 0.0125

# Similarity adapter configuration (CLIP)
[similarity_config]
adapter = "local_clip"
model = "apple/DFN5B-CLIP-ViT-H-14-378"
col_name = "clip_score"
device = "cpu"
use_safetensors = true
